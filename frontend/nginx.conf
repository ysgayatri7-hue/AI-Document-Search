server {
  listen 80;
  root /usr/share/nginx/html;
  # Leave room for multipart framing while the API enforces the exact 20 MB PDF limit.
  client_max_body_size 21m;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

