name: ai-document-search

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verity
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verity-local-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U verity"], interval: 5s, timeout: 3s, retries: 15}
  qdrant:
    image: qdrant/qdrant:v1.12.6
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck: {test: [CMD-SHELL, "bash -c '</dev/tcp/127.0.0.1/6333'"], interval: 10s, timeout: 3s, retries: 10}
  backend:
    build:
      context: ./backend
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-true}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://verity:${POSTGRES_PASSWORD:-verity-local-only}@postgres:5432/verity
      QDRANT_URL: http://qdrant:6333
    volumes: [uploads:/app/uploads]
    expose: ["8000"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck: {test: [CMD, "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"], interval: 15s, timeout: 5s, retries: 10}
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data: {name: verity-ai_postgres_data}
  qdrant_data: {name: verity-ai_qdrant_data}
  uploads: {name: verity-ai_uploads}

