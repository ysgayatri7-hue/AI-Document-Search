[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# CI blocks syntax errors and undefined names. Formatting remains intentionally
# separate so contributors can adopt project-wide formatting without noisy diffs.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q -p no:cacheprovider"

